---
# --------------------------------------------------------------
# Water alerts - always on, home or away.
# Complements the UI "Water Leak - Notify" automation (point leak
# sensors); this covers whole-house flow anomalies seen by Flume.
# Critical push: breaks through silent mode and Do Not Disturb.
# --------------------------------------------------------------

# Point leak sensors. Notifies every mobile app (notify.notify), not
# just Mike's phone, since a leak matters to the whole household.
# 5s debounce filters sub-second sensor flaps; kept short because the
# Third Reality sensors clear almost instantly when contact is lost.
  - alias: 'Water - Notify when a leak sensor is wet'
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.boiler_leak_sensor_water_leak_detected
          - binary_sensor.basement_window_leak_sensor_water_leak_detected
          - binary_sensor.basement_leak_sensor_finished_basement_water_leak_detected
          - binary_sensor.basement_leak_sensor_washer_water_leak_detected
          - binary_sensor.leak_sensor_basement_main_water_leak
        from: 'off'
        to: 'on'
        for:
          seconds: 5
    action:
      - service: notify.notify
        data:
          title: 'Water Leak Detected'
          message: "{{ trigger.to_state.attributes.friendly_name }}"
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0

  - alias: 'Water - Notify on Flume high flow or leak'
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.flume_sensor_home_high_flow
          - binary_sensor.flume_sensor_home_leak_detected
        from: 'off'
        to: 'on'
    action:
      - service: notify.mobile_app_mikes_iphone
        data:
          title: 'Water Alert'
          message: >-
            {% if 'high_flow' in trigger.entity_id %}
              Flume detected unusually high water flow.
            {% else %}
              Flume detected a possible leak.
            {% endif %}
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
