---
# Detect when the dryer runs and set it to the 'Running' state: vibration
# with the door closed for 5 minutes straight. A healthy sensor stays 'on'
# for the whole cycle, while a bump or door slam only holds it ~90s.
  - alias: Dryer - Set to running on sustained vibration with door closed
    trigger:
      - platform: state
        entity_id: binary_sensor.dryer_vibration_closed
        to: 'on'
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_select.dryer_status
        state: Idle
      - condition: state
        entity_id: binary_sensor.basement_dryer_door
        state: 'off'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.dryer_status
          option: Running
      - service: input_datetime.set_datetime
        entity_id: input_datetime.dryer_start
        data_template:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# When vibration stops for 3 minutes (on top of z2m's 90s decay), mark the
# dryer as finished and send a notification. It stays 'Finished' until the
# door is opened.
  - alias: Dryer - Set to finished and send notification after vibration stops
    trigger:
      - platform: state
        entity_id: binary_sensor.dryer_vibration_sensor_vibration
        to: 'off'
        for:
          minutes: 3
    condition:
      - condition: state
        entity_id: input_select.dryer_status
        state: Running
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.dryer_status
          option: Finished
      - service: input_datetime.set_datetime
        entity_id: input_datetime.dryer_stop
        data_template:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: notify.alexa_media
        data:
          message: 'The dryer is finished.'
          data:
            type: announce
            method: all
          target:
            - media_player.kitchen_echo_show
      - service: notify.notify
        data:
          message: 'The dryer is finished.'
          title: 'Dryer'

# If the door still hasn't been opened an hour after finishing, send a
# reminder that the clothes are still in the dryer.
  - alias: Dryer - Remind if clothes are left in the dryer
    trigger:
      - platform: state
        entity_id: input_select.dryer_status
        to: Finished
        for:
          hours: 1
    condition:
      - condition: state
        entity_id: binary_sensor.basement_dryer_door
        state: 'off'
    action:
      - service: notify.alexa_media
        data:
          message: 'The clothes are still in the dryer.'
          data:
            type: announce
            method: all
          target:
            - media_player.kitchen_echo_show
      - service: notify.notify
        data:
          message: 'The clothes are still in the dryer.'
          title: 'Dryer'

# Opening the door after the dryer finishes resets it back to idle.
  - alias: Dryer - Reset to idle when the door is opened
    trigger:
      - platform: state
        entity_id: binary_sensor.basement_dryer_door
        to: 'on'
    condition:
      - condition: state
        entity_id: input_select.dryer_status
        state: Finished
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.dryer_status
          option: Idle
