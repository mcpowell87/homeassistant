---
# --------------------------------------------------------------
# Smoke / CO alarm notifications
# Always on (not gated on vacation mode). Sends a critical push
# that breaks through silent mode and Do Not Disturb.
#
# Sources:
#   - Zooz ZEN55 (Z-Wave, wired to the interconnected alarms)
#   - UniFi Protect cameras listening for alarm sounds
# --------------------------------------------------------------

  - alias: 'Smoke Alarm - Notify when smoke or CO detected'
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.smoke_detector_smoke_detected
          - binary_sensor.smoke_detector_carbon_monoxide_detected
          - binary_sensor.living_room_smoke_alarm_detected
          - binary_sensor.front_door_smoke_alarm_detected
          - binary_sensor.back_door_smoke_alarm_detected
          - binary_sensor.living_room_co_alarm_detected
          - binary_sensor.front_door_co_alarm_detected
          - binary_sensor.back_door_co_alarm_detected
        from: 'off'
        to: 'on'
    action:
      - service: notify.mobile_app_mikes_iphone
        data:
          title: 'EMERGENCY'
          message: "{{ trigger.to_state.attributes.friendly_name }} at {{ now().strftime('%-I:%M %p') }}."
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
