---
- type: conditional
  conditions:
    - entity: input_select.washer_status
      state_not: Idle
  card:
    type: tile
    entity: sensor.washer_on_time
    name: Washer Elapsed Time
    icon: mdi:washing-machine
- type: conditional
  conditions:
    - entity: input_select.dryer_status
      state: Running
  card:
    type: tile
    entity: sensor.dryer_on_time
    name: Dryer Elapsed Time
    icon: mdi:tumble-dryer
- type: conditional
  conditions:
    - entity: input_select.dryer_status
      state: Finished
  card:
    type: tile
    entity: sensor.dryer_off_time
    name: Dryer is done
    icon: mdi:tumble-dryer-off
    color: green