turn_off_all_lights:
  alias: Turn off all lights
  sequence:
  - service: light.turn_off
    entity_id: all
  - service: switch.turn_off
    entity_id:
    - switch.hallway_light
    - switch.pantry_light
    - switch.back_entry_light
    - switch.interior_christmas_lights
  mode: single
  icon: mdi:lightbulb-group-off
