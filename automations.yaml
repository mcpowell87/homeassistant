- id: gate_display_auto_dim
  alias: Gate display auto-dim
  description: Sets gate display closed brightness. Vacation mode dims hard; otherwise
    daytime brightness during the day, and at night dim unless the kitchen or kitchen
    island lights are on.
  trigger:
  - platform: state
    entity_id: sun.sun
    to:
    - above_horizon
    - below_horizon
  - platform: state
    entity_id:
    - light.kitchen_lights
    - light.kitchen_island
    - input_boolean.vacation_mode
    to:
    - 'on'
    - 'off'
  - platform: homeassistant
    event: start
  condition: []
  action:
  - service: number.set_value
    target:
      entity_id: number.backyard_gate_display_closed_brightness
    data:
      value: "{{ 3 if is_state('input_boolean.vacation_mode', 'on') else (60 if is_state('sun.sun',
        'above_horizon') else (60 if is_state('light.kitchen_lights', 'on') or is_state('light.kitchen_island',
        'on') else 10)) }}"
  mode: restart
