- sensor:
    - name: "Open Window Count"
      unique_id: open_window_count
      default_entity_id: sensor.open_window_count
      # The only window with a live contact sensor. Add new window
      # sensors to both lists as they are installed.
      state: >-
        {{ ['binary_sensor.upstairs_bathroom_window_open']
           | select('is_state', 'on') | list | count }}
      icon: >-
        {% set open = ['binary_sensor.upstairs_bathroom_window_open']
           | select('is_state', 'on') | list | count %}
        {{ 'mdi:window-open' if open > 0 else 'mdi:window-closed' }}
