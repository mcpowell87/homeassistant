- sensor:
    - name: "Open Door Count"
      unique_id: open_door_count
      default_entity_id: sensor.open_door_count
      # Exterior doors with live contact sensors (the back door has none).
      # Front door state is reported by its Z-Wave lock.
      state: >-
        {{ ['binary_sensor.front_door_lock_current_status_of_the_door',
            'binary_sensor.basement_door_contact']
           | select('is_state', 'on') | list | count }}
      icon: >-
        {% set open = ['binary_sensor.front_door_lock_current_status_of_the_door',
                       'binary_sensor.basement_door_contact']
           | select('is_state', 'on') | list | count %}
        {{ 'mdi:door-open' if open > 0 else 'mdi:door-closed' }}
