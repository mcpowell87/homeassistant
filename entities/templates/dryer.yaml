---
# Smoothed vibration state. The raw Zigbee vibration sensor is bursty: it
# drops to 'off' for up to a few minutes mid-cycle, so this sensor only
# reports 'off' after 5 continuous minutes without vibration.
- binary_sensor:
    - name: "Dryer Vibrating"
      default_entity_id: binary_sensor.dryer_vibrating
      state: "{{ is_state('binary_sensor.dryer_vibration_sensor_vibration', 'on') }}"
      delay_off:
        minutes: 5

- sensor:
    - name: "Dryer on Time"
      default_entity_id: sensor.dryer_on_time
      state: >
        {{ (as_timestamp(now())
            - state_attr('input_datetime.dryer_start', 'timestamp'))
            | timestamp_custom('%H:%M:%S', false) }}

    - name: "Dryer on Time Complete"
      default_entity_id: sensor.dryer_on_time_complete
      state: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          {{ states('sensor.dryer_on_time') }}
        {% else %}
          '---'
        {% endif %}
      icon: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          mdi:tumble-dryer
        {% else %}
          mdi:tumble-dryer-off
        {% endif %}