---
# Strength-based activity detection. The binary vibration signal proved
# unreliable (16-minute blackouts mid-cycle at default sensitivity), but a
# running dryer produces strength reports of 105-130 at most ~10 minutes
# apart, while loading bumps read 38-65 and idle checkins are ~hourly
# repeats of a stale value. Active therefore means two consecutive reports
# above 90 within 15 minutes, clearing after 15 minutes without one.
- trigger:
    - platform: state
      entity_id: sensor.dryer_vibration_strength
  binary_sensor:
    - name: "Dryer Strength Active"
      default_entity_id: binary_sensor.dryer_strength_active
      state: >
        {{ trigger.to_state.state | float(0) > 90
           and trigger.from_state is not none
           and trigger.from_state.state | float(0) > 90
           and (trigger.to_state.last_updated
                - trigger.from_state.last_updated).total_seconds() < 900 }}
      auto_off:
        minutes: 15

- sensor:
    - name: "Dryer on Time"
      default_entity_id: sensor.dryer_on_time
      state: >
        {{ (as_timestamp(now())
            - state_attr('input_datetime.dryer_start', 'timestamp'))
            | timestamp_custom('%H:%M:%S', false) }}

    - name: "Dryer on Time Complete"
      default_entity_id: sensor.dryer_on_time_complete
      state: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          {{ states('sensor.dryer_on_time') }}
        {% else %}
          '---'
        {% endif %}
      icon: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          mdi:tumble-dryer
        {% else %}
          mdi:tumble-dryer-off
        {% endif %}