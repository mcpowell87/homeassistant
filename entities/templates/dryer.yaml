---
# Vibration occurring while the door is closed. With a healthy battery at
# sensitivity 6 the Zigbee vibration sensor stays 'on' for the whole cycle
# (it reports every ~55s, inside z2m's 90s decay), so sustained 'on' here
# is the start signal. Loading bumps happen with the door open, and a door
# slam only holds the sensor ~90s.
- binary_sensor:
    - name: "Dryer Vibration Closed"
      default_entity_id: binary_sensor.dryer_vibration_closed
      state: >
        {{ is_state('binary_sensor.dryer_vibration_sensor_vibration', 'on')
           and is_state('binary_sensor.basement_dryer_door', 'off') }}

- sensor:
    - name: "Dryer on Time"
      default_entity_id: sensor.dryer_on_time
      state: >
        {{ (as_timestamp(now())
            - state_attr('input_datetime.dryer_start', 'timestamp'))
            | timestamp_custom('%H:%M:%S', false) }}

    - name: "Dryer off Time"
      default_entity_id: sensor.dryer_off_time
      state: >
        {{ (as_timestamp(now())
            - state_attr('input_datetime.dryer_stop', 'timestamp'))
            | timestamp_custom('%H:%M:%S', false) }}

    - name: "Dryer on Time Complete"
      default_entity_id: sensor.dryer_on_time_complete
      state: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          {{ states('sensor.dryer_on_time') }}
        {% else %}
          '---'
        {% endif %}
      icon: >
        {% if is_state('input_select.dryer_status', 'Running') %}
          mdi:tumble-dryer
        {% else %}
          mdi:tumble-dryer-off
        {% endif %}